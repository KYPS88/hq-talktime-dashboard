<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HQ RAM CRM Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a1628;
    --bg-card: #122036;
    --bg-card2: #1a2c47;
    --border: #233b5e;
    --primary: #4a90ff;
    --primary-2: #1e64d4;
    --accent: #00d4ff;
    --good: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
    --text: #e6ecf5;
    --text-dim: #8aa0c2;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Prompt', sans-serif; }
  body { background: linear-gradient(135deg, #0a1628 0%, #0f1f3a 100%); min-height: 100vh; }

  .wrap { max-width: 1500px; margin: 0 auto; padding: 24px; }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(30,64,175,0.3);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; right: -50px; top: -50px;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  }
  .header h1 {
    margin: 0 0 6px 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #ffffff;
  }
  .header .sub {
    color: #bfdbfe;
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 500;
  }
  .header .meta {
    position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
    text-align: right; color: #dbeafe; font-size: 13px;
  }
  .header .meta b { color: #fff; font-size: 15px; }

  /* KPI GRID */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 16px;
  }
  .kpi-grid.kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
  .kpi-grid.kpi-grid-3 { grid-template-columns: repeat(3, 1fr); }
  .kpi {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
    transition: transform .15s ease;
  }
  .kpi:hover { transform: translateY(-2px); }
  .kpi .label {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 500;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .kpi .value {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.1;
  }
  .kpi .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
  }
  .kpi-icon {
    position: absolute; right: 14px; top: 14px;
    width: 36px; height: 36px; border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; opacity: .85;
  }
  .kpi.good .kpi-icon { background: linear-gradient(135deg, #10b981, #059669); }
  .kpi.warn .kpi-icon { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .kpi.info .kpi-icon { background: linear-gradient(135deg, #06b6d4, #0891b2); }
  .kpi.purple .kpi-icon { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }

  /* SECTION */
  .section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 16px 0;
    display: flex; align-items: center; gap: 10px;
    color: var(--text);
  }
  .section-title::before {
    content: ''; width: 4px; height: 18px; border-radius: 2px;
    background: linear-gradient(180deg, var(--primary), var(--accent));
  }

  /* PERFORMANCE LEADERS */
  .leaders {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .leader-card {
    background: var(--bg-card2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    display: flex; gap: 12px; align-items: center;
    position: relative;
    transition: all .15s ease;
  }
  .leader-card:hover { border-color: var(--primary); transform: translateY(-2px); }
  .leader-card .rank {
    position: absolute; top: 8px; right: 10px;
    font-size: 11px; color: var(--text-dim); font-weight: 600;
  }
  .leader-card.top1 { border-color: var(--gold); box-shadow: 0 0 24px rgba(251,191,36,0.15); }
  .leader-card.top1 .rank { color: var(--gold); }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 22px; color: #fff;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,.1);
    overflow: hidden;
  }
  .leader-info .name {
    font-weight: 600; font-size: 15px;
  }
  .leader-info .ext { color: var(--text-dim); font-size: 12px; }
  .leader-info .stats {
    display: flex; gap: 10px; margin-top: 4px;
    font-size: 12px;
  }
  .leader-info .stats span b { color: var(--accent); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  th {
    background: var(--bg-card2);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: .5px;
    text-transform: uppercase;
    position: sticky; top: 0;
    white-space: nowrap;
  }
  tbody tr:hover { background: rgba(74,144,255,0.05); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.center, td.center { text-align: center; }
  td.score-cell { font-weight: 700; color: var(--accent); }
  td.name-cell { display: flex; align-items: center; gap: 10px; }
  td .mini-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 14px;
    overflow: hidden; flex-shrink: 0;
  }
  .badge {
    display: inline-block; padding: 3px 10px;
    border-radius: 12px; font-size: 11px; font-weight: 600;
  }
  .badge.good { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge.warn { background: rgba(245,158,11,.15); color: #fbbf24; }
  .badge.bad  { background: rgba(239,68,68,.15);  color: #f87171; }

  /* PROGRESS BAR */
  .progress {
    width: 100%; height: 6px; background: var(--bg);
    border-radius: 3px; overflow: hidden; margin-top: 4px;
  }
  .progress .bar {
    height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
  }

  @media (max-width: 980px) {
    .kpi-grid, .kpi-grid.kpi-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .header .meta { position: static; transform: none; margin-top: 12px; text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>HQ RAM CRM PERFORMANCE DASHBOARD</h1>
    <div class="sub">INFINITY BLU8 CO., LTD</div>
    <div class="meta">
      <div>อัปเดตล่าสุด</div>
      <b id="asOf"></b>
    </div>
  </div>

  <!-- KPI ROW 1: CALLS -->
  <div class="kpi-grid kpi-grid-3" id="kpiRow1"></div>
  <!-- KPI ROW 2: SALES -->
  <div class="kpi-grid" id="kpiRow2"></div>

  <!-- PERFORMANCE LEADERS -->
  <div class="section">
    <h2 class="section-title">🏆 Performance Leaders</h2>
    <div class="leaders" id="leaders"></div>
  </div>

  <!-- PERFORMANCE BOARD TABLE -->
  <div class="section">
    <h2 class="section-title">📊 Performance Board</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="center">#</th>
            <th>พนักงาน</th>
            <th class="center">EXT</th>
            <th class="num">สาย</th>
            <th class="num">รับสาย</th>
            <th class="num">&gt;15วิ</th>
            <th class="num">Talktime</th>
            <th class="num">ยอดขาย</th>
            <th class="num">ออเดอร์</th>
            <th class="num">Size</th>
            <th class="num">Conv.</th>
            <th class="num">Achieve</th>
            <th class="num">Score</th>
          </tr>
        </thead>
        <tbody id="board"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const D = JSON.parse(document.getElementById('payload').textContent);

const fmtInt = n => (n||0).toLocaleString('th-TH');
const fmtMoney = n => '฿' + Math.round(n||0).toLocaleString('th-TH');
const fmtHMS = s => {
  s = Math.max(0, Math.floor(s||0));
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  return `${h}:${m}:${sec}`;
};

document.getElementById('asOf').textContent = D.as_of;

// KPI cards
function kpi(label, value, sub, icon, cls) {
  return `<div class="kpi ${cls||''}">
    <div class="kpi-icon">${icon}</div>
    <div class="label">${label}</div>
    <div class="value">${value}</div>
    ${sub?`<div class="sub">${sub}</div>`:''}
  </div>`;
}

const k = D.kpis;
document.getElementById('kpiRow1').innerHTML = [
  kpi('จำนวนสายโทรออก', fmtInt(k.total_calls), 'รวมทุกพนักงาน', '📞', 'info'),
  kpi('ลูกค้าคุย > 15 วิ', fmtInt(k.total_over15), `จาก ${fmtInt(k.total_calls)} สาย`, '👥', 'good'),
  kpi('TALK TIME รวม', fmtHMS(k.talk_total_sec), '', '⏱️', ''),
].join('');

document.getElementById('kpiRow2').innerHTML = [
  kpi('ยอดขายวันนี้', fmtMoney(k.total_sales), `เป้า ${fmtMoney(k.target_daily_all)}`, '💰', 'good'),
  kpi('จำนวนออเดอร์', fmtInt(k.total_orders), 'วันนี้', '🛒', 'info'),
  kpi('SIZE BUCKET', fmtMoney(k.avg_basket_all), 'เฉลี่ยบิล', '📦', 'warn'),
  kpi('CONVERSION', (k.conv_all||0).toFixed(1) + '%', 'รับสาย/ทั้งหมด', '🎯', 'purple'),
  kpi('ACHIEVED', (k.achieved_all||0).toFixed(1) + '%', `เป้ารวม ${fmtMoney(k.target_daily_all)}`, '🏁', (k.achieved_all>=100?'good':(k.achieved_all>=70?'warn':''))),
].join('');

// === SCORE: ยอดขาย 40% + ทอล์กไทม์ 30% + จำนวนสายโทรออก 30% ===
// normalize แต่ละ metric ด้วย max ของกลุ่ม (กัน div-by-zero)
const maxSales = Math.max(1, ...D.rows.map(r => r.sales_today || 0));
const maxTalk  = Math.max(1, ...D.rows.map(r => r.talk_total_sec || 0));
const maxCalls = Math.max(1, ...D.rows.map(r => r.total_calls || 0));
D.rows.forEach(r => {
  const sN = (r.sales_today || 0) / maxSales;
  const tN = (r.talk_total_sec || 0) / maxTalk;
  const cN = (r.total_calls || 0) / maxCalls;
  r.score = (sN * 0.40 + tN * 0.30 + cN * 0.30) * 100;
});

// Sort by score desc (Leaders + Board ใช้ลำดับเดียวกัน)
const sorted = [...D.rows].sort((a,b) => (b.score||0) - (a.score||0));
function avatarHTML(r, size) {
  if (r.photo) {
    return `<div class="avatar" style="background:${r.color};padding:0;overflow:hidden;"><img src="${r.photo}" style="width:100%;height:100%;object-fit:cover;display:block;"/></div>`;
  }
  return `<div class="avatar" style="background: linear-gradient(135deg, ${r.color}, ${r.color}99);">${r.initial}</div>`;
}
function miniAvatarHTML(r) {
  if (r.photo) {
    return `<div class="mini-avatar" style="background:${r.color};padding:0;overflow:hidden;"><img src="${r.photo}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;"/></div>`;
  }
  return `<div class="mini-avatar" style="background:${r.color};">${r.initial}</div>`;
}

document.getElementById('leaders').innerHTML = sorted.map((r,i) => `
  <div class="leader-card ${i===0?'top1':''}">
    <span class="rank">#${i+1}</span>
    ${avatarHTML(r)}
    <div class="leader-info">
      <div class="name">${r.name}</div>
      <div class="ext">ext ${r.ext}</div>
      <div class="stats">
        <span>⏱️ <b>${fmtHMS(r.talk_total_sec)}</b></span>
        <span>📞 <b>${fmtInt(r.total_calls)}</b></span>
      </div>
    </div>
  </div>
`).join('');

// Performance Board Table — sort by talktime desc
function badgeFor(pct) {
  if (pct >= 100) return `<span class="badge good">${pct.toFixed(0)}%</span>`;
  if (pct >= 70)  return `<span class="badge warn">${pct.toFixed(0)}%</span>`;
  return `<span class="badge bad">${pct.toFixed(0)}%</span>`;
}
document.getElementById('board').innerHTML = sorted.map((r, i) => `
  <tr>
    <td class="center"><b>${i+1}</b></td>
    <td><div class="name-cell">${miniAvatarHTML(r)}${r.name}</div></td>
    <td class="center">${r.ext}</td>
    <td class="num">${fmtInt(r.total_calls)}</td>
    <td class="num">${fmtInt(r.answered)}</td>
    <td class="num">${fmtInt(r.over30)}</td>
    <td class="num"><b>${fmtHMS(r.talk_total_sec)}</b></td>
    <td class="num">${fmtMoney(r.sales_today)}</td>
    <td class="num">${fmtInt(r.orders_today)}</td>
    <td class="num">${fmtMoney(r.avg_basket)}</td>
    <td class="num">${(r.conversion||0).toFixed(1)}%</td>
    <td class="num">${badgeFor(r.achieved_pct||0)}</td>
    <td class="num score-cell">${(r.score||0).toFixed(1)}</td>
  </tr>
`).join('');

</script>
</body>
